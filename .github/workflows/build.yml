name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Decrypt release keystore
        env:
          ENC_PASS: ${{ secrets.KEYSTORE_ENC_PASS }}
        run: |
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -pass pass:"$ENC_PASS" -in ubahkan-release.jks.enc -out app/ubahkan-release.jks
          echo "d42d062284a1496b93129a09175d6340461bdc4d7b56a3941437bf575c1b9b0f  app/ubahkan-release.jks" | sha256sum -c -
      - name: Write local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_ENC_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_ENC_PASS }}
        run: |
          {
            echo "RELEASE_STORE_FILE=ubahkan-release.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ubahkan-release-apk
          path: app/build/outputs/apk/release/app-release.apk
